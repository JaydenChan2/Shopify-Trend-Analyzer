<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Spike or Stay</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Static page served without the app (it may be the app that's broken), so styles are inline. -->
  <style>
    :root { color-scheme: dark; --bg: #07080a; --surface: #0c0e11; --ink: #f2f4f7; --muted: #98a1ad; --subtle: #5f6874; --border: rgba(255,255,255,0.08); --line: rgba(255,255,255,0.16); --accent: #3dffa0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 18px; color: var(--ink);
           background: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px) 0 0 / 56px 56px, linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px) 0 0 / 56px 56px, var(--bg);
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15.5px; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
    .code { margin: 28px 0 8px; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 38px); line-height: 1.08; letter-spacing: -0.04em; font-weight: 600; }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; font-weight: 500; font-size: 14.5px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); }
    .btn-primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/icon.svg" alt="" width="26" height="26"> Spike or Stay</a>
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>There's nothing at this address. It may have moved, or the link has a typo.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/dashboard">Open the dashboard</a>
      <a class="btn" href="/">Home</a>
    </div>
  </main>
</body>
</html>
