<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bad request · Spike or Stay</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Static page served without the app (it may be the app that's broken), so styles are inline. -->
  <style>
    :root { color-scheme: light; --bg: #ffffff; --soft: #f5f7fa; --ink: #0b2545; --muted: #4a5b74; --subtle: #7a8aa0; --border: #e4e9f0; --green: #059669; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #0a0f1a; --soft: #111827; --ink: #e8eef7; --muted: #a8b4c7; --subtle: #7d8aa0; --border: #1f2a3d; --green: #34d399; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
           font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 520px; text-align: center; background: var(--soft); border: 1px solid var(--border); border-radius: 28px; padding: 40px 28px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
    .code { margin: 28px 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--green); }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 6vw, 34px); line-height: 1.15; letter-spacing: -0.025em; }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 700; font-size: 15px; text-decoration: none; border: 1.5px solid var(--border); color: var(--ink); }
    .btn-primary { background: var(--green); border-color: var(--green); color: #fff; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/icon.svg" alt="" width="32" height="32"> Spike or Stay</a>
    <p class="code">Error 400</p>
    <h1>Bad request</h1>
    <p>Something in that link didn't make sense to us.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/dashboard">Open the dashboard</a>
      <a class="btn" href="/">Home</a>
    </div>
  </main>
</body>
</html>
