<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>That change couldn't be saved · Spike or Stay</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Static page served without the app (it may be the app that's broken), so styles are inline. -->
  <style>
    :root { color-scheme: light; --bg: #fbfaf6; --ink: #1d1c1a; --muted: #5a574f; --subtle: #8a867c; --border: #e5e1d8; --line: #cfc9bc; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #151513; --ink: #ecebe6; --muted: #b0ada3; --subtle: #85827a; --border: #2d2c28; --line: #403e38; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 18px; background: var(--bg); color: var(--ink);
           font: 16px/1.6 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 560px; border-top: 1px solid var(--ink); padding-top: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; font: 600 19px "Iowan Old Style", Charter, Georgia, serif; color: var(--ink); text-decoration: none; }
    .code { margin: 28px 0 6px; font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--subtle); }
    h1 { margin: 0 0 10px; font: 600 clamp(28px, 6vw, 36px)/1.15 "Iowan Old Style", Charter, Georgia, serif; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 4px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); }
    .btn-primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/icon.svg" alt="" width="26" height="26"> Spike or Stay</a>
    <p class="code">Error 422</p>
    <h1>That change couldn't be saved</h1>
    <p>The form may have expired. Go back, reload the page and try again.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/dashboard">Open the dashboard</a>
      <a class="btn" href="/">Home</a>
    </div>
  </main>
</body>
</html>
