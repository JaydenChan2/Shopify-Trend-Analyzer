# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
# Runs the public demo. DEMO_MODE keeps each visitor's mapping fixes in their own session.
services:
  - type: web
    name: spike-or-stay
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      # Signs cookies and CSRF tokens. Render generates a random one.
      - key: SECRET_KEY_BASE
        generateValue: true
      # Required by Wikipedia's API policy (an email or URL). You type it in when creating the Blueprint.
      - key: WIKI_CONTACT
        sync: false
      # Optional, and only used when DEMO_MODE is off: lets you change shared mappings
      # on the live site (username "admin"). Blank = shared mappings are locked.
      - key: OVERRIDES_PASSWORD
        sync: false
      # Public demo: visitors' mapping fixes stay in their own session; header says "Demo store".
      - key: DEMO_MODE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
