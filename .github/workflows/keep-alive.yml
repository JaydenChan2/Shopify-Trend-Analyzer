# Keeps the Render free instance awake: it sleeps after 15 minutes without traffic,
# and waking takes ~15s (plus the cache warming again). A request every 10 minutes
# keeps it up, so the cache warmed at boot stays warm too.
#
# Budget: Render gives 750 free instance hours a month per workspace; one service
# awake all month uses ~720-744, so this only fits if it's your only free service.
# GitHub may delay scheduled runs by a few minutes, and turns schedules off after
# 60 days without commits; re-enable it from the Actions tab if that happens.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # "Run workflow" button for a manual check

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Set a repository variable KEEPALIVE_URL to point somewhere else.
      URL: ${{ vars.KEEPALIVE_URL || 'https://spike-or-stay-ecsk.onrender.com/up' }}
    steps:
      - name: Ping the health check
        run: |
          # Retries cover the ~15s wake-up if it did fall asleep.
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 \
               --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" "$URL"
